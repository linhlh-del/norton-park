# Chép vào /etc/nginx/snippets/nortonpark-security.conf — header bảo mật (trừ CSP) dùng lại trong mỗi location.
# Nhớ đổi dòng HSTS theo giai đoạn giống nginx.conf.
add_header Strict-Transport-Security "max-age=3600; includeSubDomains" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Embedder-Policy "credentialless" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
