# ============================================================
# Norton Park — cấu hình Nginx cho thư mục dist/ (npm run build)
# Chép vào /etc/nginx/sites-available/nortonpark, sửa server_name / đường dẫn chứng chỉ / root, rồi:
#   sudo nginx -t && sudo systemctl reload nginx
# Yêu cầu module: ngx_http_sub_module (có sẵn trong gói nginx phổ thông), http_v2.
# ============================================================

# 1) HTTP → HTTPS (301) cho mọi tên miền
server {
    listen 80;
    listen [::]:80;
    server_name nortonpark.com.vn www.nortonpark.com.vn;
    return 301 https://www.nortonpark.com.vn$request_uri;
}

# 2) Tên miền không www → www (một URL chuẩn duy nhất, khớp canonical)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name nortonpark.com.vn;
    ssl_certificate     /etc/letsencrypt/live/nortonpark.com.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nortonpark.com.vn/privkey.pem;
    return 301 https://www.nortonpark.com.vn$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.nortonpark.com.vn;

    ssl_certificate     /etc/letsencrypt/live/nortonpark.com.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nortonpark.com.vn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/nortonpark/dist;
    index index.html;
    charset utf-8;

    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;
    # brotli on; brotli_types ...;   # nếu đã cài ngx_brotli

    # ---------- Nonce CSP theo từng lượt tải ----------
    # Bản build ghi sẵn nonce="__CSP_NONCE__" trên script nạp bundle; Nginx thay bằng $request_id (ngẫu nhiên 128-bit)
    # và đưa đúng giá trị đó vào header CSP. Tắt cache HTML để nonce không bị dùng lại.
    set $csp_nonce $request_id;
    sub_filter_once off;
    sub_filter_types text/html;
    sub_filter '__CSP_NONCE__' $csp_nonce;

    # ---------- Header bảo mật (áp dụng mọi response của server này) ----------
    # Strict CSP: nonce + 'strict-dynamic'. 'unsafe-inline' https: chỉ là dự phòng cho trình duyệt cũ — trình duyệt
    # hỗ trợ nonce sẽ bỏ qua chúng. Sửa report-uri thành endpoint nhận báo cáo của bạn (hoặc xoá).
    set $csp "script-src 'nonce-$csp_nonce' 'strict-dynamic' 'unsafe-inline' https:; object-src 'none'; base-uri 'none'; frame-ancestors 'self'; require-trusted-types-for 'script'; trusted-types np default goog#html 'allow-duplicates'; report-uri https://csp-report.nortonpark.com.vn/report";
    add_header Content-Security-Policy $csp always;

    # HSTS triển khai theo giai đoạn — chỉ bật MỘT dòng:
    #   Giai đoạn 1 (thử 1 tuần):
    add_header Strict-Transport-Security "max-age=3600; includeSubDomains" always;
    #   Giai đoạn 2 (ổn định ≥ 1 tuần, không lỗi subdomain):
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    #   Giai đoạn 3 (rồi đăng ký https://hstspreload.org):
    # add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    # credentialless thay vì require-corp: require-corp chặn script/ảnh bên thứ ba không gửi header CORP
    # (GTM, pixel quảng cáo, ảnh bài báo). Đổi sang require-corp khi đã chắc mọi tài nguyên ngoài đều có CORP.
    add_header Cross-Origin-Embedder-Policy "credentialless" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # ---------- Cache ----------
    # Lưu ý: add_header trong location sẽ GHI ĐÈ header ở cấp server, nên lặp lại header bảo mật qua include.
    location /assets/ {
        include /etc/nginx/snippets/nortonpark-security.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }
    location /images/_optimized/ {
        include /etc/nginx/snippets/nortonpark-security.conf;
        add_header Cache-Control "public, max-age=2592000, stale-while-revalidate=86400" always;
        try_files $uri =404;
    }
    location /images/ {
        include /etc/nginx/snippets/nortonpark-security.conf;
        add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400" always;
        try_files $uri =404;
    }
    location = /.well-known/ard.json {
        include /etc/nginx/snippets/nortonpark-security.conf;
        default_type application/json;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=3600" always;
    }

    # Trang: dist/<route>/index.html đã prerender; route không tồn tại → 404.html kèm mã 404 thật
    location / {
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy $csp always;
        include /etc/nginx/snippets/nortonpark-security.conf;
        try_files $uri $uri/index.html $uri/ =404;
    }
    error_page 404 /404.html;
    location = /404.html { internal; add_header Content-Security-Policy $csp always; include /etc/nginx/snippets/nortonpark-security.conf; }

    # Bản tiếng Anh (/en/…): 404 tiếng Anh
    location /en/ {
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy $csp always;
        include /etc/nginx/snippets/nortonpark-security.conf;
        try_files $uri $uri/index.html $uri/ =404;
        error_page 404 /en/404.html;
    }
    location = /en { try_files /en/index.html =404; add_header Cache-Control "no-cache" always; add_header Content-Security-Policy $csp always; include /etc/nginx/snippets/nortonpark-security.conf; }
    location = /en/404.html { internal; add_header Content-Security-Policy $csp always; include /etc/nginx/snippets/nortonpark-security.conf; }
}

# ---------- /etc/nginx/snippets/nortonpark-security.conf ----------
# (tạo file này với nội dung dưới — các header bảo mật trừ CSP, dùng lại trong mỗi location)
#
# add_header Strict-Transport-Security "max-age=3600; includeSubDomains" always;
# add_header X-Frame-Options "SAMEORIGIN" always;
# add_header X-Content-Type-Options "nosniff" always;
# add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# add_header Cross-Origin-Opener-Policy "same-origin" always;
# add_header Cross-Origin-Embedder-Policy "credentialless" always;
# add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
