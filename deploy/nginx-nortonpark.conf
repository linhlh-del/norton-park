# /etc/nginx/sites-available/nortonpark  →  ln -s ../sites-available/nortonpark /etc/nginx/sites-enabled/nortonpark
#
# NORTON PARK — 5 domain, MỖI DOMAIN MỘT THƯ MỤC BUILD RIÊNG (cùng mã nguồn, cấu hình trong sites/<domain>/site.env):
#   canho-nortonpark.vn          domain chính
#   nortonpark-binhduong.vn      domain vệ tinh
#   nortonparkliving.vn          domain vệ tinh
#   nortonparkhome.vn            domain vệ tinh
#   nortonparkresidences.com     domain vệ tinh
#   root = /var/www/nortonpark/sites/$host/current  (scripts/release.mjs tạo releases/ + symlink current cho từng domain)
#   www.<domain> → 301 https://<domain>
# Thêm domain mới: tạo sites/<domain>/site.env, thêm tên vào 3 chỗ server_name dưới đây, thêm route trên tunnel, build lại.
#
# Đi qua Cloudflare Tunnel. Mọi route: HTTPS → localhost:443, Origin Server Name = canho-nortonpark.vn
# → nginx chọn đúng chứng chỉ Origin của Norton Park (VPS dùng chung với dự án khác, chọn chứng chỉ theo SNI):
#   /etc/ssl/cloudflare/canho-nortonpark.vn.pem  và  /etc/ssl/cloudflare/canho-nortonpark.vn.key (chmod 600)
# nginx < 1.25.1: deploy/setup-vps.sh tự đổi "http2 on;" thành "listen 443 ssl http2;"
#
# Thư mục trên VPS:
#   /var/www/nortonpark/src                          mã nguồn (git clone) + .env.production
#   /var/www/nortonpark/sites/<domain>/releases      các bản build của domain
#   /var/www/nortonpark/sites/<domain>/current       symlink → bản đang chạy

server {
    listen 80;
    listen [::]:80;
    server_name canho-nortonpark.vn nortonpark-binhduong.vn nortonparkliving.vn nortonparkhome.vn nortonparkresidences.com
                www.canho-nortonpark.vn www.nortonpark-binhduong.vn www.nortonparkliving.vn www.nortonparkhome.vn www.nortonparkresidences.com;
    return 301 https://$host$request_uri;
}

# www.<domain> → https://<domain> (giữ đường dẫn)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.canho-nortonpark.vn www.nortonpark-binhduong.vn www.nortonparkliving.vn www.nortonparkhome.vn www.nortonparkresidences.com;

    ssl_certificate     /etc/ssl/cloudflare/canho-nortonpark.vn.pem;
    ssl_certificate_key /etc/ssl/cloudflare/canho-nortonpark.vn.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;

    location / {
        if ($host ~* ^www\.(.+)$) { return 301 https://$1$request_uri; }
        return 301 https://canho-nortonpark.vn$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name canho-nortonpark.vn nortonpark-binhduong.vn nortonparkliving.vn nortonparkhome.vn nortonparkresidences.com;

    ssl_certificate     /etc/ssl/cloudflare/canho-nortonpark.vn.pem;
    ssl_certificate_key /etc/ssl/cloudflare/canho-nortonpark.vn.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # $host chỉ có thể là một trong 5 tên ở server_name → mỗi domain đọc đúng thư mục của mình
    root /var/www/nortonpark/sites/$host/current;
    index index.html;
    charset utf-8;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;

    # ---------- Nonce CSP theo từng lượt tải ----------
    # Bản build ghi nonce="__CSP_NONCE__" trên script nạp bundle; nginx thay bằng $request_id và đưa cùng giá trị vào CSP.
    set $csp_nonce $request_id;
    sub_filter_once off;
    sub_filter_types text/html;
    sub_filter '__CSP_NONCE__' $csp_nonce;
    set $csp "script-src 'nonce-$csp_nonce' 'strict-dynamic' 'unsafe-inline' https:; object-src 'none'; base-uri 'none'; frame-ancestors 'self'; require-trusted-types-for 'script'; trusted-types np default goog#html 'allow-duplicates'";

    # Header bảo mật (trừ CSP): deploy/nortonpark-security.conf → /etc/nginx/snippets/
    # add_header trong location ghi đè header cấp server → lặp lại include + CSP trong từng location.
    add_header Content-Security-Policy $csp always;
    include /etc/nginx/snippets/nortonpark-security.conf;

    # ---------- Cache ----------
    location ^~ /assets/ {
        include /etc/nginx/snippets/nortonpark-security.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }
    location ^~ /images/_optimized/ {
        include /etc/nginx/snippets/nortonpark-security.conf;
        add_header Cache-Control "public, max-age=2592000, stale-while-revalidate=86400" always;
        try_files $uri =404;
    }
    location ~ ^/(images|fonts|font)/ {
        include /etc/nginx/snippets/nortonpark-security.conf;
        add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400" always;
        try_files $uri =404;
    }
    location = /.well-known/ard.json {
        include /etc/nginx/snippets/nortonpark-security.conf;
        default_type application/json;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=3600" always;
    }
    # CMS đọc 2 file này (trường sửa được, bản đang chạy)
    location ~ ^/cms-(schema|status)\.json$ {
        include /etc/nginx/snippets/nortonpark-security.conf;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "no-store" always;
    }

    # ---------- Trang: <route>/index.html đã prerender; route không tồn tại → 404 thật ----------
    rewrite ^/(.+)/$ /$1 permanent;
    location / {
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy $csp always;
        include /etc/nginx/snippets/nortonpark-security.conf;
        try_files $uri $uri/index.html =404;
    }
    # Đường dẫn section (/cau-chuyen, /ban-do, /dang-ky — src/lib/sections.js): HTML trang chủ, JS cuộn tới section
    location ~ ^/(en/)?(cau-chuyen|ban-do|dang-ky)$ {
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy $csp always;
        include /etc/nginx/snippets/nortonpark-security.conf;
        try_files /$1index.html =404;
    }
    error_page 404 /404.html;
    location = /404.html { internal; add_header Content-Security-Policy $csp always; include /etc/nginx/snippets/nortonpark-security.conf; }

    # Bản tiếng Anh (/en/…): 404 tiếng Anh
    location /en/ {
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy $csp always;
        include /etc/nginx/snippets/nortonpark-security.conf;
        try_files $uri $uri/index.html =404;
        error_page 404 /en/404.html;
    }
    location = /en { try_files /en/index.html =404; add_header Cache-Control "no-cache" always; add_header Content-Security-Policy $csp always; include /etc/nginx/snippets/nortonpark-security.conf; }
    location = /en/404.html { internal; add_header Content-Security-Policy $csp always; include /etc/nginx/snippets/nortonpark-security.conf; }

    # chặn file ẩn (.env, .git…) — trừ /.well-known/
    location ~ /\.(?!well-known/) { deny all; return 404; }
}
